name: church_inventory
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.12.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  qr_flutter: ^4.1.0
  shared_preferences: ^2.2.3
  path_provider: ^2.1.1
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.3
  cloud_firestore: ^6.6.0
  mobile_scanner: ^5.2.3
  google_sign_in: ^6.2.1
  permission_handler: ^11.3.1
  flutter_local_notifications: ^17.2.1
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/mtc_logo.png

flutter_launcher_icons:
  android: "ic_launcher"
  image_path: "assets/icon/mtc_logo.png"
  web:
    generate: true
    image_path: "assets/icon/mtc_logo.png"
